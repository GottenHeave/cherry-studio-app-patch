name: Release patch line

on:
  workflow_call:
    inputs:
      line:
        description: Upstream branch and patch line
        required: true
        type: string
      eas-project-id:
        description: Patch repository EAS project ID
        required: true
        type: string
      ios-bundle-identifier:
        description: Repository-owned iOS bundle identifier
        required: true
        type: string
      android-package:
        description: Repository-owned Android package
        required: true
        type: string
      eas-ios-credentials-ready:
        description: Attestation that repository-owned iOS signing credentials are configured
        required: true
        type: boolean
      eas-android-credentials-ready:
        description: Attestation that repository-owned Android signing credentials are configured
        required: true
        type: boolean
    secrets:
      EXPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/_validate-line.yml
    with:
      line: ${{ inputs.line }}

  preflight:
    name: Prepare ${{ inputs.line }} release
    needs: validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out patch repository tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          path: ${{ runner.temp }}/verified

      - name: Restore verified source repository
        run: ./scripts/restore-verified-source.sh "$RUNNER_TEMP/verified/verified-source.tar.gz" "$RUNNER_TEMP/source"

      - name: Fail closed on release configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ inputs.eas-project-id }}
          IOS_BUNDLE_IDENTIFIER: ${{ inputs.ios-bundle-identifier }}
          ANDROID_PACKAGE: ${{ inputs.android-package }}
          EAS_IOS_CREDENTIALS_READY: ${{ inputs.eas-ios-credentials-ready }}
          EAS_ANDROID_CREDENTIALS_READY: ${{ inputs.eas-android-credentials-ready }}
        shell: bash
        run: |
          [[ -n "$EXPO_TOKEN" ]] || { echo 'EXPO_TOKEN secret is required.' >&2; exit 1; }
          [[ -n "$EAS_PROJECT_ID" ]] || { echo 'EAS_PROJECT_ID variable is required.' >&2; exit 1; }
          [[ -n "$IOS_BUNDLE_IDENTIFIER" ]] || { echo 'IOS_BUNDLE_IDENTIFIER variable is required.' >&2; exit 1; }
          [[ -n "$ANDROID_PACKAGE" ]] || { echo 'ANDROID_PACKAGE variable is required.' >&2; exit 1; }
          [[ "$EAS_IOS_CREDENTIALS_READY" == 'true' ]] || { echo 'EAS_IOS_CREDENTIALS_READY=true attestation is required.' >&2; exit 1; }
          [[ "$EAS_ANDROID_CREDENTIALS_READY" == 'true' ]] || { echo 'EAS_ANDROID_CREDENTIALS_READY=true attestation is required.' >&2; exit 1; }

      - name: Calculate collision-free tag
        id: version
        env:
          LINE: ${{ inputs.line }}
        shell: bash
        run: |
          case "$LINE" in
            main)
              version="$(node -p "require('$RUNNER_TEMP/source/package.json').version")"
              prefix="main-v${version}-patch"
              ;;
            v0.2) prefix='v0.2-patch' ;;
            *) echo "Unsupported patch line: $LINE" >&2; exit 2 ;;
          esac
          highest="$(git tag -l "${prefix}.*" | sed -n 's/^.*\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          echo "tag=${prefix}.$(( ${highest:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  build-android:
    name: EAS Android (${{ inputs.line }})
    needs: [validate, preflight]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EAS_NO_VCS: '1'
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Check out patch automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          path: ${{ runner.temp }}/verified
      - name: Restore verified source repository
        run: ./scripts/restore-verified-source.sh "$RUNNER_TEMP/verified/verified-source.tar.gz" "$RUNNER_TEMP/source"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.validate.outputs.pnpm }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ runner.temp }}/source/pnpm-lock.yaml
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/source
        run: pnpm install --frozen-lockfile
      - name: Bind repository-owned EAS identity
        env:
          EAS_PROJECT_ID: ${{ inputs.eas-project-id }}
          IOS_BUNDLE_IDENTIFIER: ${{ inputs.ios-bundle-identifier }}
          ANDROID_PACKAGE: ${{ inputs.android-package }}
        run: ./scripts/configure-eas-project.sh "$RUNNER_TEMP/source" "$EAS_PROJECT_ID" "$IOS_BUNDLE_IDENTIFIER" "$ANDROID_PACKAGE"
      - name: Start Android build
        id: build
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          pnpm exec eas build --platform android --profile production --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/build.json")"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Wait for Android and download APK
        working-directory: ${{ runner.temp }}/source
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          while :; do
            pnpm exec eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/status.json"
            status="$(jq -r '.status | ascii_downcase' "$RUNNER_TEMP/status.json")"
            case "$status" in
              finished) break ;;
              errored | canceled) echo "Android EAS build ended with status: $status" >&2; exit 1 ;;
              *) echo "Android build status: $status"; sleep 60 ;;
            esac
          done
          url="$(jq -er '.artifacts.buildUrl' "$RUNNER_TEMP/status.json")"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/CherryStudio-${RELEASE_TAG}.apk" "$url"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.line }}
          path: ${{ runner.temp }}/CherryStudio-${{ needs.preflight.outputs.tag }}.apk
          if-no-files-found: error

  build-ios:
    name: EAS iOS (${{ inputs.line }})
    needs: [validate, preflight]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EAS_NO_VCS: '1'
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Check out patch automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified source
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          path: ${{ runner.temp }}/verified
      - name: Restore verified source repository
        run: ./scripts/restore-verified-source.sh "$RUNNER_TEMP/verified/verified-source.tar.gz" "$RUNNER_TEMP/source"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.validate.outputs.pnpm }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ runner.temp }}/source/pnpm-lock.yaml
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/source
        run: pnpm install --frozen-lockfile
      - name: Bind repository-owned EAS identity
        env:
          EAS_PROJECT_ID: ${{ inputs.eas-project-id }}
          IOS_BUNDLE_IDENTIFIER: ${{ inputs.ios-bundle-identifier }}
          ANDROID_PACKAGE: ${{ inputs.android-package }}
        run: ./scripts/configure-eas-project.sh "$RUNNER_TEMP/source" "$EAS_PROJECT_ID" "$IOS_BUNDLE_IDENTIFIER" "$ANDROID_PACKAGE"
      - name: Start iOS build without submission
        id: build
        working-directory: ${{ runner.temp }}/source
        shell: bash
        run: |
          pnpm exec eas build --platform ios --profile production --non-interactive --no-wait --json > "$RUNNER_TEMP/build.json"
          build_id="$(jq -er '.[0].id' "$RUNNER_TEMP/build.json")"
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
      - name: Wait for iOS and download IPA
        working-directory: ${{ runner.temp }}/source
        env:
          BUILD_ID: ${{ steps.build.outputs.build-id }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          while :; do
            pnpm exec eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/status.json"
            status="$(jq -r '.status | ascii_downcase' "$RUNNER_TEMP/status.json")"
            case "$status" in
              finished) break ;;
              errored | canceled) echo "iOS EAS build ended with status: $status" >&2; exit 1 ;;
              *) echo "iOS build status: $status"; sleep 60 ;;
            esac
          done
          url="$(jq -er '.artifacts.buildUrl' "$RUNNER_TEMP/status.json")"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/CherryStudio-${RELEASE_TAG}.ipa" "$url"
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.line }}
          path: ${{ runner.temp }}/CherryStudio-${{ needs.preflight.outputs.tag }}.ipa
          if-no-files-found: error

  publish:
    name: Publish ${{ inputs.line }} release
    needs: [validate, preflight, build-android, build-ios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android-${{ inputs.line }}
          path: artifacts
      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ inputs.line }}
          path: artifacts
      - name: Create GitHub release once
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cherry Studio ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          body: |
            Clewdr patch line: `${{ inputs.line }}`
            Verified upstream commit: `${{ needs.validate.outputs.upstream-sha }}`
            Android EAS build: `${{ needs.build-android.outputs.build-id }}`
            iOS EAS build: `${{ needs.build-ios.outputs.build-id }}`

            These builds were not submitted to an app store.
          files: artifacts/*
